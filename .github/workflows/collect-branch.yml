name: Playwright Collector (Branch)
run-name: ${{ github.actor }} is Collecting a Branch! 🚀
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  Setup:
    runs-on: ubuntu-latest
    outputs:
      Date: ${{ steps.date.outputs.date }}
      v18: ${{ steps.v.outputs.v18 }}
      v20: ${{ steps.v.outputs.v20 }}
      v22: ${{ steps.v.outputs.v22 }}
      v24: ${{ steps.v.outputs.v24 }}
    steps:
      - name: Get current date
        id: DATE
        run: |
          echo -n "Getting Date: "
          echo "DATE=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo -e "$DATE\nFile:\n$GITHUB_OUTPUT"
          echo -e "\nValues:"
          cat $GITHUB_OUTPUT

      - name: Get current node versions
        id: v
        run: |
          echo -e "Getting versions"

          # Fetch the Node.js version data
          node_versions=$(curl -s https://nodejs.org/dist/index.json)

          # Function to get the latest version for a specific major version
          get_version() { 
            major_version=$1 
            echo $node_versions |\
              jq -r --arg major_version "v$major_version" \
                '[.[] | select(.version | startswith($major_version))][0].version'
          }

          # Fetch the latest versions for v18, v20, v22, and v24
          v18=$(get_version 18)
          v20=$(get_version 20)
          v22=$(get_version 22)
          v24=$(get_version 24)

          echo "The latest Node.js v18 version is: $v18"
          echo "The latest Node.js v20 version is: $v20"
          echo "The latest Node.js v22 version is: $v22"
          echo "The latest Node.js v24 version is: $v24"

          echo "v18=${v18}" >> $GITHUB_OUTPUT
          echo "v20=${v20}" >> $GITHUB_OUTPUT
          echo "v22=${v22}" >> $GITHUB_OUTPUT
          echo "v24=${v24}" >> $GITHUB_OUTPUT

          echo -e "\nFile:\n$GITHUB_OUTPUT"
          echo "Values:"
          cat $GITHUB_OUTPUT

  Collect:
    runs-on: ubuntu-latest
    needs: [ Setup ]

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true

      - name: Use Node.js ${{ needs.Setup.outputs.v18 }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.Setup.outputs.v18 }}

      - name: Enable Corepack
        run: |
          echo -e "\nUpdating apt repositories"
          sudo apt-get update -y

          echo -e "\nEnabling Corepack for Yarn"
          sudo corepack enable
          yarn set version stable
          echo -e "\nNode Version: $(node -v)"
          echo "Yarn version: $(yarn -v)"

      - name: Setup Git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Run yarn with verdaccio
        run: |
          export XDG_DATA_HOME=$PWD
          export PLAYWRIGHT_BROWSERS_PATH=${{ github.WORKSPACE }}/browsers
          mkdir -p browsers 

          echo -e "\nRunning Verdaccio"
          yarn dlx verdaccio >\
            verdaccio/verdaccio.log 2>\
            verdaccio/verdaccio-err.log &
          tail -f verdaccio/verdaccio.log & P=$! && sleep 20 && kill -9 $P
          echo -e "\nTailing errors\n" &&\
          tail verdaccio/verdaccio-err.log

          echo -e "\nSetting up registries"
          npm set registry http://localhost:4873/
          yarn config set npmRegistryServer http://localhost:4873/

          echo -e "\nChecking Connectivity\n"
          curl http://localhost:4873 -o test.html
          sleep 1

          echo -e "\nRunning Yarn"
          yarn install

          echo -e "\nPacking Yarn offline cache"
          mkdir -p offline/
          corepack pack -o offline/yarn-offline.tar.gz

          echo -e "\nPacking Playwright packages"
          mkdir -p offline/npm
          cd offline/npm
          npm pack playwright @playwright/test
          cd -

          echo -e "\nInstalling Playwright Browsers"
          npx playwright install --with-deps

      - name: Download VSCode extension
        run: |
          mkdir -p offline/vscode
          curl -L -o offline/vscode/playwright.vsix \
            https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-playwright/vsextensions/playwright/latest/vspackage

      - name: Yarn Listings
        run: echo -e "\nListing .yarn/*:\n$(ls -1Ssh .yarn/*)"

      - name: Offline Listings
        run: |
          echo -e "\nListing Offline/*"
          ls -1Ssh offline/*
          echo -e "\nListing Consumption"
          du -chd0 offline/*

      - name: TARchive browser directory
        run: |
          tar -cvI pigz -f ${{ vars.COLLECTOR }}-browsers-${{ needs.Setup.outputs.Date }}.tgz \
            --remove-files browsers \
            | tee ${{ vars.COLLECTOR }}-browsers-${{ needs.Setup.outputs.Date }}.tgz.txt

      - name: TARchive browsers directory SHA HASH
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-browsers-${{ needs.Setup.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-browsers-${{ needs.Setup.outputs.Date }}.tgz.sha

      - name: TARchive offline directory
        run: |
          tar -cvI pigz -f ${{ vars.COLLECTOR }}-offline-${{ needs.Setup.outputs.Date }}.tgz \
            --remove-files offline \
            | tee ${{ vars.COLLECTOR }}-offline-${{ needs.Setup.outputs.Date }}.tgz.txt

      - name: TARchive offline directory SHA HASH
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-offline-${{ needs.Setup.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-offline-${{ needs.Setup.outputs.Date }}.tgz.sha

      - name: Verdaccio Listings
        run: |
          echo -e "\nListing verdaccio/*"
          ls -1Ssh verdaccio/*
          echo -e "\nListing Consumption"
          du -chd0 node_modules verdaccio/*

      - name: TARchive verdaccio storage directory
        run: |
          tar -cvI pigz -f ${{ vars.COLLECTOR }}-verdaccio-${{ needs.Setup.outputs.Date }}.tgz \
            verdaccio \
            | tee ${{ vars.COLLECTOR }}-verdaccio-${{ needs.Setup.outputs.Date }}.tgz.txt

      - name: TARchive verdaccio storage directory SHA HASH
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-yarn-cache-${{ needs.Setup.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-yarn-cache-${{ needs.Setup.outputs.Date }}.tgz.sha

      - name: TARchive verdaccio storage directory SHA HASH
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-verdaccio-${{ needs.Setup.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-verdaccio-${{ needs.Setup.outputs.Date }}.tgz.sha
      
      - name: TARchive node_modules directory
        run: |
          tar -cvI pigz -f ${{ vars.COLLECTOR }}-node-modules-${{ needs.Setup.outputs.Date }}.tgz \
            node_modules yarn.lock \
            | tee ${{ vars.COLLECTOR }}-node-modules-${{ needs.Setup.outputs.Date }}.tgz.txt

      - name: TARchive node_modules directory SHA HASH
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-node-modules-${{ needs.Setup.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-node-modules-${{ needs.Setup.outputs.Date }}.tgz.sha
      
      - name: TARchive .yarn directory
        run: |
          tar -cvI pigz -f ${{ vars.COLLECTOR }}-yarn-${{ needs.Setup.outputs.Date }}.tgz \
            .yarn yarn.lock \
            | tee ${{ vars.COLLECTOR }}-yarn-${{ needs.Setup.outputs.Date }}.tgz.txt

      - name: TARchive yarn directory SHA HASH
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-yarn-${{ needs.Setup.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-yarn-${{ needs.Setup.outputs.Date }}.tgz.sha

      - name: Upload browser artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-browsers-${{ needs.Setup.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-browsers-${{ needs.Setup.outputs.Date }}.tgz*
          if-no-files-found: error

      - name: Upload Offline artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-offline-${{ needs.Setup.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-offline-${{ needs.Setup.outputs.Date }}.tgz*
          if-no-files-found: error

      - name: Upload verdaccio artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-verdaccio-${{ needs.Setup.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-verdaccio-${{ needs.Setup.outputs.Date }}.tgz*
          if-no-files-found: error

      - name: Upload node-modules artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-node-modules-${{ needs.Setup.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-node-modules-${{ needs.Setup.outputs.Date }}.tgz*
          if-no-files-found: error

      - name: Upload yarn artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-yarn-${{ needs.Setup.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-yarn-${{ needs.Setup.outputs.Date }}.tgz*
          if-no-files-found: error

      - name: Upload Verdaccio Logs
        uses: actions/upload-artifact@v7
        with:
          name: Verdaccio-Logs-${{ needs.Setup.outputs.Date }}.log
          path: "verdaccio/*.log"

  Skopeo:
    needs: [Setup]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Skopeo
        run: |
          sudo apt-get update -y
          sudo apt-get install -y skopeo pigz

      - name: ${{ vars.REGISTRY }} Login
        run: |
          skopeo login ${{ vars.REGISTRY }}  \
            -u ${{ secrets.REGISTRY_USER }} \
            -p ${{ secrets.REGISTRY_TOKEN }}

      - name: Run Skopeo Sync
        run: |
          skopeo sync --scoped \
            --src yaml --dest dir \
            ${{ vars.COLLECTOR }}.yml \
            ${{ vars.COLLECTOR }}

      - name: Directory Contents
        run: |
          echo -e "\nDirectory Contents"
          ls -lAhS . ${{ vars.COLLECTOR }}
          echo -e "\nDirectory Size"
          du -hd2 .

      - name: TARchive Skopeo Output
        run: |
          tar -cv -Ipigz --remove-files \
            -f ${{ vars.COLLECTOR }}-skopeo-${{ needs.Setup.outputs.Date }}.tgz ${{ vars.COLLECTOR }} \
          | tee ${{ vars.COLLECTOR }}-skopeo-${{ needs.Setup.outputs.Date }}.tgz.txt

      - name: Generate Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-skopeo-${{ needs.Setup.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-skopeo-${{ needs.Setup.outputs.Date }}.tgz.sha
 
      - name: List files 
        run: ls -1Ssh ${{ vars.COLLECTOR }}-skopeo-${{ needs.Setup.outputs.Date }}.tgz*

      - name: Upload TARchive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-skopeo-${{ needs.Setup.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-skopeo-${{ needs.Setup.outputs.Date }}.tgz*
          if-no-files-found: error

  Code:
    needs: [Setup]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup Git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Update Submodules if needed
        shell: bash
        run: |
          git submodule update --init --recursive --remote
          set +e
          git commit -am "Update Submodules"
          if [ $? -eq 1 ];then
            echo "No push required"
          else
            git push
          fi

      - name: Bundle Repo1 code base for ${{ vars.COLLECTOR }}
        run: |
          git bundle create --progress ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.bundle --all
          echo -e "\nDirectory Listing $(ls -1Ssh *)"

      - name: Generate Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.bundle | tee \
            ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.bundle.sha

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.bundle
          path: ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.bundle*
          if-no-files-found: error

      - name: TARchive code base for ${{ vars.COLLECTOR }}
        run: |
          tar -cvI pigz -C .. \
            -f ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.tgz $(basename ${{ github.WORKSPACE }}) \
            | tee ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.tgz.txt

      - name: Generate TARchive Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.tgz | tee \
            ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.tgz.sha

      - name: Directory Listing
        run: echo -e "\nDirectory Listing for $PWD\n$(ls -1Ssh)"

      - name: Upload Tarchive, ToC, and hash
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-code-${{ needs.Setup.outputs.Date }}.tgz*
          if-no-files-found: error

  MakeISO:
    runs-on: ubuntu-latest
    needs: [Setup, Code, Skopeo, Collect]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install mkisofs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mkisofs isomd5sum

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ISO

      - name: Download VSCode extension
        run: |
          mkdir -p ISO/vscode
          curl -L -o ISO/vscode/playwright.vsix \
            https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-playwright/vsextensions/playwright/latest/vspackage

      - name: Copy Markdowns to ISO
        run: cp -v *.md ISO/

      - name: Show Artifacts
        run: |
          echo -e "Directory Listing:\n$(ls -1Ssh ISO)"
          echo -e "\nDirectory Size:\n$(du -chd0 ISO)"
          echo -e "\nFile structure:\n$(tree -L 3 ISO|tee ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.txt)"

      - name: Generate Comprehensive Artifacts Hash File
        run: |
          cd ISO
          sha256sum -b * vscode/* | tee \
            ../${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.sha
          cd -
          cp -v ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.??? ISO/

      - name: Make ISO
        run: |
          mkisofs -J -R -v -T -l \
            -V '${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}' \
            -A '${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}' \
            -o ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso \
            ISO

      - name: Implant MD5 sum into iso
        run: implantisomd5 ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso

      - name: Generate ISO Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso | tee \
            ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso.sha

      - name: Show ISO & Hash
        run: ls -1Ssh *.iso*

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso
          path: ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso*
          if-no-files-found: error

      - name: Upload ISO SHA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso.sha
          path: ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso.sha
          if-no-files-found: error

  Scan:
    name: Compliance scan (Trivy + Grype)
    runs-on: ubuntu-latest
    needs: [Setup, Skopeo]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download skopeo artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ vars.COLLECTOR }}-skopeo-${{ needs.Setup.outputs.Date }}.tgz
          path: scan-input

      - name: Show downloaded files
        run: |
          set -euo pipefail
          echo "Downloaded files:"
          find scan-input -maxdepth 2 -type f | sort

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl tar jq

      - name: Install Trivy + Grype + skopeo
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y skopeo

          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Download report templates
        run: |
          set -euo pipefail
          mkdir -p templates

          curl -fsSL \
            -o templates/trivy-html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

          curl -fsSL \
            -o templates/grype-html.tmpl \
            https://raw.githubusercontent.com/anchore/grype/refs/heads/main/templates/html.tmpl

          ls -l templates

      - name: Extract synced images
        run: |
          set -euo pipefail

          mkdir -p extracted

          tgz="$(find scan-input -type f -name '*.tgz' | head -n 1)"
          [ -n "$tgz" ] || {
            echo "ERROR: no skopeo tgz artifact found"
            exit 1
          }

          echo "Extracting $tgz"
          tar -xvf "$tgz" -C extracted

          echo "Extracted contents:"
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Build local archive list from synced images
        run: |
          set -euo pipefail

          mkdir -p \
            scan-images \
            scan-results/trivy \
            scan-results/trivy-html \
            scan-results/grype \
            scan-results/grype-html

          : > scan-images/archives.txt

          find "extracted/${{ vars.COLLECTOR }}" -type f -name manifest.json | while read -r manifest; do
            img_dir="$(dirname "$manifest")"
            rel="${img_dir#extracted/${{ vars.COLLECTOR }}/}"
            safe="$(printf '%s' "$rel" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
            archive="scan-images/${safe}.tar"

            echo "Preparing archive from dir transport: $img_dir"

            skopeo copy \
              "dir:${img_dir}" \
              "docker-archive:${archive}:${safe}"

            echo "${img_dir}|${archive}|${safe}" >> scan-images/archives.txt
          done

          test -s scan-images/archives.txt || {
            echo "ERROR: no synced images found for scanning"
            exit 1
          }

          echo "Archive list:"
          cat scan-images/archives.txt
          
      - name: Trivy scan local synced images
        run: |
          set -euo pipefail
          : > scan-results/trivy-report.txt

          while IFS='|' read -r img_dir archive safe; do
            [ -n "$archive" ] || continue
            json_file="scan-results/trivy/${safe}.json"
            html_file="scan-results/trivy-html/${safe}.html"

            echo "=== Scanning ${img_dir} ===" | tee -a scan-results/trivy-report.txt

            trivy image \
              --quiet \
              --scanners vuln \
              --input "$archive" \
              --format json \
              -o "$json_file" \
              >> scan-results/trivy-report.txt 2>&1 || true

            if [ ! -s "$json_file" ]; then
              echo "FATAL: JSON output missing for ${img_dir} (${json_file})" | tee -a scan-results/trivy-report.txt
              continue
            fi

            trivy convert \
              --format template \
              --template "@templates/trivy-html.tpl" \
              --output "$html_file" \
              "$json_file" \
              >> scan-results/trivy-report.txt 2>&1 || true

            echo "=== ${img_dir} ===" >> scan-results/trivy-report.txt
            trivy convert --format table "$json_file" >> scan-results/trivy-report.txt 2>&1 || true
            echo >> scan-results/trivy-report.txt
          done < scan-images/archives.txt

          if grep -Eqi 'Fatal error|FATAL' scan-results/trivy-report.txt; then
            echo "Compliance failed: Trivy fatal/conversion error."
            exit 1
          fi

      - name: Grype scan local synced images
        run: |
          set -euo pipefail
          : > scan-results/grype-report.txt

          while IFS='|' read -r img_dir archive safe; do
            [ -n "$archive" ] || continue

            json_file="scan-results/grype/${safe}.json"
            html_file="scan-results/grype-html/${safe}.html"

            echo "=== Scanning ${img_dir} ===" | tee -a scan-results/grype-report.txt

            grype "docker-archive:${archive}" -o json \
              > "$json_file" \
              2>> scan-results/grype-report.txt || true

            grype "docker-archive:${archive}" \
              -o template \
              -t templates/grype-html.tmpl \
              > "$html_file" \
              2>> scan-results/grype-report.txt || true

            if [ ! -s "$json_file" ]; then
              echo "FATAL: JSON output missing for ${img_dir} (${json_file})" | tee -a scan-results/grype-report.txt
            fi

            if [ ! -s "$html_file" ]; then
              echo "FATAL: HTML output missing for ${img_dir} (${html_file})" | tee -a scan-results/grype-report.txt
            fi
          done < scan-images/archives.txt

      - name: Write vulnerability summary
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          trivy_dir = Path("scan-results/trivy")
          grype_dir = Path("scan-results/grype")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]

          def empty_counts():
              return {s: 0 for s in severities}

          def safe_sev(value):
              sev = str(value or "UNKNOWN").upper()
              return sev if sev in severities else "UNKNOWN"

          trivy_total_counts = empty_counts()
          grype_total_counts = empty_counts()
          trivy_rows = []
          grype_rows = []

          for jf in sorted(trivy_dir.glob("*.json")):
              try:
                  data = json.loads(jf.read_text())
              except Exception:
                  continue

              counts = empty_counts()
              for result in data.get("Results", []):
                  for vuln in result.get("Vulnerabilities", []) or []:
                      sev = safe_sev(vuln.get("Severity"))
                      counts[sev] += 1
                      trivy_total_counts[sev] += 1

              total = sum(counts.values())
              trivy_rows.append((jf.stem, counts, total))

          for jf in sorted(grype_dir.glob("*.json")):
              try:
                  data = json.loads(jf.read_text())
              except Exception:
                  continue

              counts = empty_counts()
              for match in data.get("matches", []) or []:
                  sev = safe_sev((match.get("vulnerability", {}) or {}).get("severity"))
                  counts[sev] += 1
                  grype_total_counts[sev] += 1

              total = sum(counts.values())
              grype_rows.append((jf.stem, counts, total))

          def counts_table(title, totals):
              lines = []
              lines.append(f"## {title}")
              lines.append("")
              lines.append("| Severity | Count |")
              lines.append("|---|---:|")
              for sev in severities:
                  lines.append(f"| {sev} | {totals[sev]} |")
              lines.append(f"| **TOTAL** | **{sum(totals.values())}** |")
              lines.append("")
              return lines

          def per_image_table(title, rows):
              lines = []
              lines.append(f"## {title}")
              lines.append("")
              lines.append("| Image | Critical | High | Medium | Low | Unknown | Total |")
              lines.append("|---|---:|---:|---:|---:|---:|---:|")
              for name, counts, total in rows:
                  lines.append(
                      f"| `{name}` | {counts['CRITICAL']} | {counts['HIGH']} | {counts['MEDIUM']} | {counts['LOW']} | {counts['UNKNOWN']} | {total} |"
                  )
              lines.append("")
              return lines

          lines = ["# Vulnerability Summary", ""]
          lines += counts_table("Trivy Totals", trivy_total_counts)
          lines += counts_table("Grype Totals", grype_total_counts)
          lines += per_image_table("Trivy Per Image", trivy_rows)
          lines += per_image_table("Grype Per Image", grype_rows)

          with summary_path.open("a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
          
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}-scan
          path: |
            scan-results/
            scan-images/archives.txt
            templates/
          if-no-files-found: error

  ISOTest:
    runs-on: ubuntu-latest
    needs: [Setup, MakeISO]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Install isomd5sum
        run: |
          sudo apt-get update -y
          sudo apt-get install -y isomd5sum tree

      - name: Download ISO and hash
        uses: actions/download-artifact@v8
        with:
          pattern: "${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso*"
          merge-multiple: true

      - name: Validate ISO Hashes
        run: |
          echo -e "List Artifacts"
          ls -Alht
          echo -e "\nCheck injected ISO MD5"
          checkisomd5 ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso
          echo -e "\nCheck ISO sha256"
          sha256sum -cw ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso.sha

      - name: Mount ISO
        run: sudo mount -v -o loop ${{ vars.COLLECTOR }}-${{ needs.Setup.outputs.Date }}.iso /mnt

      - name: Display contents
        run: |
          echo -e "Directory Listing:\n$(ls -1Ssh /mnt)"
          echo -e "\nDirectory Size:\n$(du -chd0 /mnt)"
          echo -e "\nFile structure:\n$(tree -L 3 /mnt)"

      - name: Validate embedded hashes
        run: |
          echo -e "\nValidating embedded SHA256 hashes"
          find /mnt -name "*.sha" -execdir sha256sum -c {} +

  Release:
    runs-on: ubuntu-latest
    needs: [Setup, ISOTest, Scan]
    permissions:
      contents: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ vars.COLLECTOR }}-[ovnyc]*.tgz
          merge-multiple: true

      - name: Show Artifacts
        run: |
          echo -e "Directory Listing:\n$(ls -1Ssh ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nDirectory Size:\n$(du -chd0 ${{ vars.COLLECTOR }}-*.*)"

  Sharepoint:
    runs-on: ubuntu-latest
    needs: [Setup, ISOTest, Scan]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: |
          echo -e "Directory Listing:\n$(ls -1Ssh ${{ vars.COLLECTOR }}-*.*)"
          echo -e "\nDirectory Size:\n$(du -chd0 ${{ vars.COLLECTOR }}-*.*)"
